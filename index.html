<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة Grammatik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly teacher, clear and encouraging
   IDEA: a student's notebook page written with blue, red and green pens
   PICTURE: the exercise card itself, sentences in handwriting with the ending circled
   COLOUR and TYPE: paper white, ink blue, red pen for corrections, green for correct; Cairo + Kalam
   LAYOUT: language switch, modest title, level strip, big exercise card, then the rule tables */
:root{color-scheme:light dark;--bg:#f6f4ee;--paper:#fff;--line:#dfe6f3;--ink:#1b2233;--soft:#5a6378;--blue:#1f4fbf;--red:#c62f2f;--green:#1f7a48;--blueBg:#e8efff;--redBg:#fdecec;--greenBg:#e6f5ec}
@supports (color:light-dark(red,red)){:root{
--bg:light-dark(#f6f4ee,#14171f);--paper:light-dark(#ffffff,#1d2230);--line:light-dark(#dfe6f3,#2a3144);
--ink:light-dark(#1b2233,#e8ebf3);--soft:light-dark(#5a6378,#a4adc2);
--blue:light-dark(#1f4fbf,#8fb0ff);--red:light-dark(#c62f2f,#ff8b8b);--green:light-dark(#1f7a48,#6fd39c);
--blueBg:light-dark(#e8efff,#22305a);--redBg:light-dark(#fdecec,#4a2228);--greenBg:light-dark(#e6f5ec,#1d3d2c)}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:900px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px) 60px}
.langs{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px}
.langs button{font:600 14px Cairo,sans-serif;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.langs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;font-weight:800;text-wrap:balance}
h1 .de-w{color:var(--blue)}
.topic{font-size:20px;font-weight:600;margin:0 0 2px}
footer{margin-top:48px;padding-top:18px;border-top:1.5px solid var(--line);color:var(--soft);font-size:14px;text-align:center}
.sub{color:var(--soft);margin:0 0 22px}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lv{font:600 14px Cairo,sans-serif;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:6px}
.lv.on{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.lv small{font-weight:400;opacity:.85}
.card{background:var(--paper);border-radius:18px;border:1.5px solid var(--line);padding:clamp(18px,3.5vw,32px);
background-image:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px);background-position:0 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.bar{height:8px;border-radius:9px;background:var(--line);margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.task{font-weight:600;color:var(--blue);margin:12px 0 0}
.de{direction:ltr;text-align:left;font:700 clamp(22px,4.6vw,32px)/1.5 Kalam,cursive;margin:14px 0 20px;color:var(--ink)}
.gap{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--blue);color:var(--blue);text-align:center;padding:0 4px}
.gap.ok{color:var(--green);border:2.5px solid var(--green);border-radius:50%;padding:0 10px}
.gap.bad{color:var(--red);border:2.5px solid var(--red);border-radius:50%;padding:0 10px}
.hl{background:var(--blueBg);border-radius:6px;padding:0 6px}
.hint{direction:ltr;text-align:left;color:var(--soft);font-size:15px;margin:-12px 0 16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.op{font:700 22px Kalam,cursive;direction:ltr;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.op.word{font:600 17px Cairo,sans-serif;direction:inherit}
.op:hover:not(:disabled){border-color:var(--blue)}
.op.ok{background:var(--greenBg);border-color:var(--green);color:var(--green)}
.op.bad{background:var(--redBg);border-color:var(--red);color:var(--red)}
.op:disabled{cursor:default}
input[type=text]{width:100%;font:700 22px Kalam,cursive;direction:ltr;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-height:54px}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.err{color:var(--red);font-size:14px;margin:6px 0 0;min-height:1.2em}
.btn{font:600 16px Cairo,sans-serif;min-height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--blue);color:var(--paper);cursor:pointer;width:100%;margin-top:10px}
.btn.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;display:none}
.fb.ok{display:block;background:var(--greenBg);color:var(--green)}
.fb.bad{display:block;background:var(--redBg);color:var(--red)}
.fb p{margin:0}.fb .why{color:var(--ink);margin-top:6px}
.fb b,.why b{unicode-bidi:isolate;font-family:Kalam,cursive;font-size:18px}
.score{font:800 clamp(40px,9vw,64px)/1 Cairo;color:var(--blue);margin:8px 0}
.miss{list-style:none;padding:0;margin:14px 0}
.miss li{border-top:1px solid var(--line);padding:10px 0}
.miss .s{direction:ltr;text-align:left;font:700 19px Kalam,cursive}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:12px 0 0;font-size:14px;color:var(--soft)}
.tools label{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:44px}
.tools input{width:20px;height:20px}
.link{background:none;border:0;color:var(--blue);font:600 14px Cairo;cursor:pointer;min-height:44px;padding:0}
h2{font-size:24px;margin:44px 0 12px}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.tb{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.tb h3{margin:0 0 8px;font:700 22px Kalam,cursive;direction:ltr;text-align:center;color:var(--green)}
table{width:100%;border-collapse:collapse;direction:ltr;font:400 16px Kalam,cursive}
th{font:600 12px Cairo;color:var(--soft);padding:4px;text-align:left}
td{padding:4px;border-top:1px solid var(--line);white-space:nowrap}
td.g{font:600 12px Cairo;color:var(--soft)}
.art{color:var(--red)}.e{color:var(--blue);border:1.5px solid var(--blue);border-radius:50%;padding:0 4px}
.tips{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:6px 20px 6px 36px;margin-top:14px}
[dir=rtl] .tips{padding:6px 36px 6px 20px}
.tips li{margin:8px 0}.tips b{color:var(--blue)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Kalam,cursive}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

const EX={ar:2,fr:3,en:4};

const $=x=>document.getElementById(x);

const lab=(l,v)=>l.tf?t()[v]:l.word||l.w?v:"-"+v;

function drawStatic(){

 $("tips").innerHTML=x.tips.map(s=>`<li>${s.replace(/\[\[(.+?)\]\]/g,(_,m)=>m.length<20?iso(m).replace("<bdi ","<bdi style=\"white-space:nowrap\" "):iso(m))}</li>`).join("");
 $("tables").innerHTML=TB.map(([n,r])=>`<div class="tb"><h3>${n}</h3><table><thead><tr><th></th><th>ein-</th><th>der-</th><th>${esc(x.none)}</th></tr></thead><tbody>${r.map(y=>`<tr><td class="g">${y[0]}</td><td>${mark(y[1])}</td><td>${mark(y[2])}</td><td>${mark(y[3])}</td></tr>`).join("")}</tbody></table></div>`).join("");
}
function drawLevels(){
 $("levels").innerHTML=L.map((l,k)=>{const b=st["b"+k];return `<button class="lv${k==lv?" on":""}" data-k="${k}">${k+1}. ${esc(t().lv[k])}${b!=null?` <small><bdi dir="ltr">${b}/${l.q.length}</bdi></small>`:""}</button>`}).join("");
}
function start(k,only){
 lv=k;st.lv=k;save();
 const idx=only||L[k].q.map((_,j)=>j);
 order=$("shuf").checked?idx.slice().sort(()=>Math.random()-.5):idx.slice();

}
function sentence(s,fill,cls){
 const h=esc(s).replace(/\{(.+?)\}/,'<span class="hl">$1</span>');
 return h.replace("___",`<span class="gap ${cls||""}" id="gap">${fill?esc(fill):"&nbsp;?&nbsp;"}</span>`);
}
function counter(){$("prog").textContent=(i+1)+" / "+order.length+"  ·  ✓ "+sc}
function show(){
 const l=L[lv],x=t();$("ttl").textContent=(lv+1)+". "+x.lv[lv];
 $("barI").style.width=(i/order.length*100)+"%";
 if(i>=order.length){fin=true;return finish()}
 counter();
 const q=l.q[order[i]],s=q[0],h=q[5];
 let html=`<p class="task">${esc(x.task[lv])}</p><div class="de">${sentence(s)}</div>`;
 if(h)html+=`<p class="hint">[ ${esc(h)} ]</p>`;
 if(l.w)html+=`<input type="text" id="txt" placeholder="…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(x.answer)}"><p class="err" id="err"></p><button class="btn" id="chk">${esc(x.check)}</button>`;
 else html+=`<div class="opts">${l.o.map(o=>`<button class="op${l.word?" word":""}" data-o="${esc(o)}">${esc(lab(l,o))}</button>`).join("")}</div>`;
 html+=`<div class="fb" id="fb"></div><button class="btn" id="nx" style="display:none">${esc(i==order.length-1?x.seeRes:x.next)}</button>`;
 $("body").innerHTML=html;
 if(l.w){const tx=$("txt");tx.addEventListener("input",()=>$("err").textContent="");

 $("nx").onclick=()=>{i++;res=null;show()};
 if(res)paint(false);else if(l.w)$("txt").focus();
}
function paint(focus){
 const l=L[lv],x=t(),q=l.q[order[i]],[s,a]=q,e=q[EX[lang]],ok=res.ok;
 if(s.includes("___"))document.querySelector(".de").innerHTML=sentence(s,l.w?a:a,ok?"ok":"bad");
 if(l.w){const tx=$("txt");tx.value=res.given;tx.disabled=true;$("chk").style.display="none"}
 else document.querySelectorAll(".op").forEach(b=>{b.disabled=true;if(b.dataset.o==a)b.classList.add("ok");if(!ok&&b.dataset.o==res.given)b.classList.add("bad")});
 const g=l.w?res.given:lab(l,res.given);
 const fb=$("fb");fb.className="fb "+(ok?"ok":"bad");
 fb.innerHTML=(ok?`<p>${esc(x.ok)}</p>`:`<p>${esc(x.yours)} <b><bdi dir="ltr">${esc(g)}</bdi></b> — ${esc(x.right)} <b><bdi dir="ltr">${esc(lab(l,a))}</bdi></b></p>`)+`<p class="why">${bi(e)}</p>`;
 const nx=$("nx");nx.style.display="block";if(focus)nx.focus();
}
function answer(given,ok){
 res={given,ok};if(ok)sc++;else wrong.push(order[i]);counter();paint(true);
}
function pick(btn){if(res)return;const a=L[lv].q[order[i]][1];answer(btn.dataset.o,btn.dataset.o==a)}
function check(){
 if(res)return;const tx=$("txt");if(!tx.value.trim()){$("err").textContent=t().empty;return}
 answer(tx.value.trim(),norm(tx.value)==norm(L[lv].q[order[i]][1]));
}
function finish(){
 const l=L[lv],x=t(),n=order.length;
 if(n==l.q.length&&sc>(st["b"+lv]??-1)){st["b"+lv]=sc;save()}
 drawLevels();$("prog").textContent="";
 const msg=sc==n?x.m3:sc>=n*.7?x.m2:x.m1;
 let h=`<p class="task">${esc(x.result)}</p><div class="score"><bdi dir="ltr">${sc} / ${n}</bdi></div><p>${esc(msg)}</p>`;
 if(wrong.length)h+=`<p class="task">${esc(x.mist)}</p><ul class="miss">${wrong.map(j=>{const q=l.q[j],s=q[0];return `<li><div class="s">${sentence(s,s.includes("___")?q[1]:null,"ok")}</div><div class="why">${!s.includes("___")?`<b><bdi dir="ltr">${esc(lab(l,q[1]))}</bdi></b> — `:""}${bi(q[EX[lang]])}</div></li>`}).join("")}</ul><button class="btn" id="rw">${esc(x.redoW)}</button>`;
 h+=`<button class="btn alt" id="ra">${esc(x.redoA)}</button>`;
 if(lv<L.length-1)h+=`<button class="btn${wrong.length?" alt":""}" id="nl">${esc(x.nextL)} ${esc(x.lv[lv+1])}</button>`;

 if($("nl"))$("nl").onclick=()=>{start(lv+1);window.scrollTo({top:0})};
}
const TB=[
["Nominativ",[["m","ein roter","der rote","roter"],["n","ein rotes","das rote","rotes"],["f","eine rote","die rote","rote"],["Pl","— rote","die roten","rote"]]],
["Akkusativ",[["m","einen roten","den roten","roten"],["n","ein rotes","das rote","rotes"],["f","eine rote","die rote","rote"],["Pl","— rote","die roten","rote"]]],
["Dativ",[["m","einem roten","dem roten","rotem"],["n","einem roten","dem roten","rotem"],["f","einer roten","der roten","roter"],["Pl","— roten","den roten","roten"]]]];
const mark=s=>{const p=s.split(" "),adj=p.pop(),m=adj.match(/^(rot)(.+)$/);return (p.length?`<span class="art">${esc(p.join(" "))}</span> `:"")+m[1]+`<span class="e">${m[2]}</span>`};

$("levels").addEventListener("click",ev=>{const b=ev.target.closest(".lv");if(b)start(+b.dataset.k)});
$("body").addEventListener("click",ev=>{const b=ev.target.closest(".op");if(b)pick(b)});
$("langs").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b||b.dataset.l==lang)return;lang=b.dataset.l;st.lang=lang;save();drawStatic();drawLevels();fin?finish():show()});
document.addEventListener("keydown",ev=>{
 if(ev.target.tagName=="INPUT")return;
 const n=+ev.key,ops=document.querySelectorAll(".op");
 if(!res&&!fin&&n>=1&&n<=ops.length)pick(ops[n-1]);
 else if(ev.key=="Enter"&&res&&$("nx")){ev.preventDefault();$("nx").click()}
});
$("shuf").checked=!!st.shuf;$("shuf").onchange=()=>{st.shuf=$("shuf").checked;save();start(lv)};
$("reset").onclick=()=>{st={shuf:st.shuf,lang};save();start(0)};
drawStatic();start(lv);
}
